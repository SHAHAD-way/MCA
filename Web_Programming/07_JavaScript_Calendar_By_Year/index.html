<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Calendar by Year</title>
<style>
body{font-family:Arial;margin:20px}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.month{border:1px solid #aaa;padding:10px;border-radius:8px}.month h3{text-align:center}
table{width:100%;border-collapse:collapse;text-align:center}td,th{padding:4px;border:1px solid #ddd}
</style></head>
<body>
<h1>Yearly Calendar</h1>
<label>Enter year: <input id="year" type="number" min="1" max="9999" value="2026"></label>
<button onclick="generateCalendar()">Generate Calendar</button>
<div id="calendar" class="months"></div>
<script>
const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
function generateCalendar(){
 const year=Number(document.getElementById("year").value);
 const output=document.getElementById("calendar"); output.innerHTML="";
 if(!Number.isInteger(year)||year<1||year>9999){output.textContent="Enter a year from 1 to 9999.";return;}
 monthNames.forEach((name,m)=>{
   const first=new Date(year,m,1).getDay(), days=new Date(year,m+1,0).getDate();
   let html=`<section class="month"><h3>${name} ${year}</h3><table><tr>${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<th>${d}</th>`).join("")}</tr><tr>`;
   for(let i=0;i<first;i++) html+="<td></td>";
   for(let day=1;day<=days;day++){html+=`<td>${day}</td>`;if((first+day)%7===0&&day!==days)html+="</tr><tr>";}
   html+="</tr></table></section>"; output.insertAdjacentHTML("beforeend",html);
 });
}
generateCalendar();
</script></body></html>
