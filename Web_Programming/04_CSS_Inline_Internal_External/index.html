<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>CSS Types</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Internal stylesheet */
    .internal-box { background: #fff3cd; border: 2px solid #d39e00; padding: 12px; }
    h1 { color: #174ea6; }
  </style>
</head>
<body>
  <h1>Inline, Internal and External CSS</h1>
  <p style="color: #c0392b; font-weight: bold;">This paragraph uses inline CSS.</p>
  <p class="internal-box">This box uses an internal stylesheet from the head section.</p>
  <p class="external-box">This box uses an external stylesheet (style.css).</p>
</body></html>
